services:
  web:
    build:
      context: .
      dockerfile: build/docker/web.Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__RentalApp: Server=host.docker.internal;Port=3306;Database=rental_app;User=root;Password=;TreatTinyAsBoolean=true;AllowPublicKeyRetrieval=true;SslMode=None
    ports:
      - "8080:8080"

  worker:
    build:
      context: .
      dockerfile: build/docker/worker.Dockerfile
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__RentalApp: Server=host.docker.internal;Port=3306;Database=rental_app;User=root;Password=;TreatTinyAsBoolean=true;AllowPublicKeyRetrieval=true;SslMode=None
