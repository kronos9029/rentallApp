services:
  web:
    build:
      context: .
      dockerfile: build/docker/web.Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "8080:8080"
    depends_on:
      - db

  worker:
    build:
      context: .
      dockerfile: build/docker/worker.Dockerfile
    environment:
      DOTNET_ENVIRONMENT: Development
    depends_on:
      - db

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: rental_app
      MYSQL_ROOT_PASSWORD: rootpw
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
